services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: roadpulse_backend
    env_file: .env
    dns:
      - 8.8.8.8
      - 8.8.4.4
    ports:
      - "8000:8000"
    volumes:
      - ./backend/app:/app

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: roadpulse_frontend
    env_file: .env
    depends_on:
      - backend
    ports:
      - "5173:5173"
    volumes:
      - ./frontend:/usr/src/app
      - /usr/src/app/node_modules # <-- important
    command: sh -c "npm install && npm run dev -- --host"  
    
  frontend-admin:
    build:
      context: ./frontend-admin
      dockerfile: Dockerfile
      args:
        VITE_API_URL: ${VITE_API_URL}
    container_name: roadpulse_admin
    depends_on:
      - backend
    ports:
      - "5174:5174"
    restart: unless-stopped
