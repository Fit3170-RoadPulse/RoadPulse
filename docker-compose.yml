services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: roadpulse_backend
    env_file: .env
    ports:
      - "8000:8000"
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        VITE_API_URL: ${VITE_API_URL}
    container_name: roadpulse_frontend
    depends_on:
      - backend
    ports:
      - "3000:3000"
    restart: unless-stopped